<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МТС Energytool — ИИ-консультант</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<!--
ИНТЕРФЕЙС

КОНТРАКТ С БЭКЕНДОМ (тот же consult(), что и в solution.py)
  POST /api/consult
    запрос : { "messages": [ {"role":"user"|"assistant","content":"..."} ] }
             (сервер сам превращает в строки «Пользователь:» / «Ассистент:», отвечать на последнюю реплику)
    ответ  : { "answer": "текст",
               "sources": [ {"path":"20-products/23-solar.md","title":"Заголовок раздела","quote":"цитата","score":0.82} ],
               "lead": null | {"fio":"","phone":"","company":"","summary":""} }
    lead пустой (null), пока клиент сам не согласился оставить контакт.
  POST /api/lead   { fio, phone, company, summary }  → 200 OK (реальную CRM не подключаем)
Если /api/consult недоступен, работает демо-заглушка (mockConsult) — чтобы интерфейс жил отдельно от бэка.
Параметр ?api=http://host:port задаёт адрес сервера. Режим отладки: переключатель в шапке или ?debug=1.
-->
<style>
:root{
  --red:#E30613; --red-d:#B8050F; --red-l:#FFE5E7;
  --ink:#111111; --ink2:#353535; --bg:#F5F5F5; --white:#FFFFFF; --line:#E3E3E3; --mute:#6b6b6b;
  --r:20px; --r-s:14px;
  --f-h:'Manrope','Inter',system-ui,sans-serif; --f-b:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.5 var(--f-b);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;height:100%;max-width:1280px;margin:0 auto;gap:0 20px;padding:0 20px 20px}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:18px 0}
.logo{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;overflow:hidden;flex:none}
.brand h1{font:800 22px/1.1 var(--f-h);letter-spacing:-.01em}
.brand p{font-size:14px;color:var(--mute)}
.sp{flex:1}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0}
.track{width:40px;height:24px;border-radius:12px;background:#cfcfcf;position:relative;transition:background .2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+.track{background:var(--red)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch input:focus-visible+.track{outline:3px solid var(--red);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:600;background:var(--red);color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:var(--red-d)} .btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sec:hover{background:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
aside{background:var(--white);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
aside h2{font:700 16px var(--f-h)}
#hist{overflow:auto;display:flex;flex-direction:column;gap:6px;flex:1}
.h-item{width:100%;text-align:left;background:var(--bg);border:0;border-radius:var(--r-s);padding:10px 12px;display:block}
.h-item:hover{background:#ececec}
.h-item[aria-current=true]{background:var(--ink);color:#fff}
.h-item b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-item small{font-size:12px;opacity:.7}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px;margin-left:6px;background:var(--red-l);color:var(--red-d)}
.h-item[aria-current=true] .tag{background:var(--red);color:#fff}
main{background:var(--white);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#log{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.empty{margin:auto;max-width:520px;text-align:center}
.empty h2{font:800 34px/1.15 var(--f-h);letter-spacing:-.02em;margin-bottom:10px}
.empty p{color:var(--mute);margin-bottom:22px}
.demos{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.demo{border:0;background:var(--bg);border-radius:var(--r-s);padding:14px 16px;text-align:left;font-weight:500;transition:transform .15s,background .15s}
.demo:hover{background:var(--red-l);transform:translateY(-2px)}
.demo small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.msg{max-width:78%;padding:12px 16px;border-radius:var(--r);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
.msg.err{background:var(--red-l);color:var(--red-d)}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.dbg{align-self:flex-start;max-width:78%;margin-top:-6px;border:1.5px dashed var(--line);border-radius:var(--r-s);padding:10px 14px;font-size:13px;color:var(--ink2);background:#fff}
.dbg .t{font-weight:600}
.dbg .src{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.dbg code{background:var(--bg);border-radius:6px;padding:1px 6px;font-size:12.5px}
.dbg blockquote{margin:4px 0 0;padding-left:10px;border-left:3px solid var(--red);color:var(--mute)}
.lead{align-self:flex-start;width:min(560px,100%);background:var(--bg);border-radius:var(--r);padding:20px;display:grid;gap:10px}
.lead h3{font:700 20px var(--f-h)}
.lead p.n{font-size:14px;color:var(--mute)}
.lead label{display:grid;gap:4px;font-size:14px;font-weight:500}
.lead input,.lead textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;resize:vertical}
.lead input:focus,.lead textarea:focus{border-color:var(--red);outline:none}
.lead .row{display:flex;gap:10px;flex-wrap:wrap}
.lead.done{background:#eaf6ee}
form.in{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
form.in textarea{flex:1;border:1.5px solid var(--line);border-radius:var(--r-s);padding:12px 14px;resize:none;max-height:140px}
form.in textarea:focus{border-color:var(--ink);outline:none}
.note{font-size:12px;color:var(--mute);padding:0 20px 10px;text-align:center}
@media(max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;gap:12px;padding:0 12px 12px}
  aside{max-height:150px}.msg,.dbg{max-width:92%}.empty h2{font-size:26px}
  .brand p{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" role="img" aria-label="Консультант техподдержки"><svg viewBox="0 0 28 28" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="13" r="4.2"/><path d="M5.5 28c0-5.2 3.8-7.6 8.5-7.6s8.5 2.4 8.5 7.6"/><path d="M7.4 13.5a6.6 6.6 0 0 1 13.2 0"/><rect x="5.6" y="12.6" width="2.6" height="5" rx="1.3"/><rect x="19.8" y="12.6" width="2.6" height="5" rx="1.3"/><path d="M21.1 17.6v.9c0 1.4-1.1 2.3-3 2.3h-1.4"/></svg></div>
    <div class="brand"><h1>Energytool</h1><p>ИИ-консультант по энергоресурсам</p></div>
    <div class="sp"></div>
    <label class="switch"><input type="checkbox" id="dbgToggle"><span class="track"></span>Отладка</label>
    <button class="btn sec" id="newBtn" type="button">Новый диалог</button>
  </header>

  <aside aria-label="История диалогов">
    <h2>История</h2>
    <div id="hist"></div>
  </aside>

  <main>
    <div id="log" aria-live="polite"></div>
    <form class="in" id="form">
      <textarea id="inp" rows="1" placeholder="Опишите задачу: объект, счета, приборы учёта…" aria-label="Сообщение"></textarea>
      <button class="btn" id="send" type="submit">Отправить</button>
    </form>
    <p class="note">Бот даёт справочную консультацию. Точную цену, расчёт по объекту и юридическое заключение даёт специалист.</p>
  </main>
</div>

<script>
/* ===== настройки ===== */
const qs = new URLSearchParams(location.search);
const API = (qs.get('api') || '').replace(/\/$/, '');
const $ = id => document.getElementById(id);

/* ===== три демо без подсказок ===== */
const DEMOS = [
  {t:'Вечерний счёт', s:'Почему вечером растёт оплата за электроэнергию', q:'У нас торговый центр, и вечером счёт за электроэнергию заметно выше. Как это снизить?'},
  {t:'Счётчики арендаторов', s:'Сбор показаний по нескольким объектам', q:'У нас 40 арендаторов, показания счётчиков собираем вручную. Как это автоматизировать?'},
  {t:'Вопрос вне базы', s:'Бот должен честно отказаться', q:'Какая завтра будет погода в Казани?'}
];

/* ===== состояние: сессии живут в памяти (+ localStorage, если доступен) ===== */
let sessions = [], cur = null, busy = false;
try { sessions = JSON.parse(localStorage.getItem('energytool_sessions') || '[]'); } catch(e){}
const save = () => { try { localStorage.setItem('energytool_sessions', JSON.stringify(sessions)); } catch(e){} };
function newSession(){
  // пустую текущую сессию не плодим
  if (cur && !cur.messages.length) return;
  cur = {id: Date.now(), title: 'Новый диалог', messages: [], leadState: 'none', lead: null, ts: Date.now()};
  sessions.unshift(cur); save(); renderAll();
}
const debugOn = () => $('dbgToggle').checked;
$('dbgToggle').checked = qs.get('debug') === '1';
$('dbgToggle').onchange = renderLog;

/* ===== вызов consult() ===== */
async function consult(messages){
  const t0 = performance.now();
  let data;
  try {
    const r = await fetch(API + '/api/consult', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({messages})});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch(e) {
    data = await mockConsult(messages); data.mock = true;
  }
  data.ms = Math.round(performance.now() - t0);
  return data;
}

/* демо-заглушка: заменяется настоящим бэкендом, фронтенд менять не нужно */
async function mockConsult(messages){
  await new Promise(r => setTimeout(r, 600));
  const last = messages[messages.length-1].content.toLowerCase();
  const all = messages.map(m=>m.content).join(' ').toLowerCase();
  const src = (path,title,quote,score)=>[{path,title,quote,score}];
  if (/(согласен|готов оставить|оставлю|запишите мой|свяжитесь|менеджер)/.test(last))
    return {answer:'Хорошо, передам запрос специалисту. Проверьте данные в карточке ниже и отправьте её.', sources:[],
            lead:{fio:'',phone:'',company:'',summary:'Клиент согласен на контакт. Задача: '+(messages.find(m=>m.role==='user')||{}).content}};
  if (/(арендатор|показани|счётчик|счетчик)/.test(all))
    return {answer:'Для многих объектов подойдёт облачная платформа учёта: показания собираются автоматически, а там, где приборы без автоматики, их можно распознать по фотографии. Сколько у вас объектов и какие приборы стоят сейчас?',
            sources:src('20-products/21-cloud-metering.md','Облачный учёт','Платформа собирает показания по объектам и показывает анализ в одном кабинете.',.81)};
  if (/(вечер|счёт|счет|закуп|мощност)/.test(all))
    return {answer:'Крупному объекту может быть выгоден выход на оптовый рынок — порог присоединённой мощности 750 кВт. Какая у вас присоединённая мощность?',
            sources:src('20-products/20-wholesale.md','Выход на оптовый рынок','Порог присоединённой мощности для выхода на оптовый рынок — 750 кВт.',.77)};
  return {answer:'В моей базе знаний нет информации по этому вопросу. Я консультирую по энергоресурсам: закупке электроэнергии, учёту, потерям и собственной генерации. Какая у вас задача по энергии?',
          sources:[], lead:null};
}

/* ===== действия ===== */
async function send(text){
  text = text.trim(); if (!text || busy) return;
  if (!cur) newSession();
  busy = true; $('send').disabled = true;
  cur.messages.push({role:'user', content:text});
  if (cur.title === 'Новый диалог') cur.title = text.slice(0, 48);
  cur.ts = Date.now(); renderAll(true);
  const payload = cur.messages.filter(m => m.role !== 'error').map(m => ({role:m.role, content:m.content}));
  const sid = cur.id;
  try {
    const d = await consult(payload);
    const s = sessions.find(x => x.id === sid);
    s.messages.push({role:'assistant', content:d.answer, sources:d.sources||[], ms:d.ms, mock:!!d.mock});
    if (d.lead && s.leadState === 'none'){ s.lead = d.lead; s.leadState = 'draft'; }
  } catch(e) {
    cur.messages.push({role:'error', content:'Не удалось получить ответ. Попробуйте ещё раз.'});
  }
  busy = false; $('send').disabled = false; save(); renderAll(true); $('inp').focus();
}
$('form').onsubmit = e => { e.preventDefault(); const v = $('inp').value; $('inp').value=''; autosize(); send(v); };
$('inp').onkeydown = e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('form').requestSubmit(); } };
$('inp').oninput = autosize;
function autosize(){ const t=$('inp'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,140)+'px'; }
$('newBtn').onclick = () => { newSession(); $('inp').focus(); };

/* ===== отрисовка ===== */
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt!=null) e.textContent = txt; return e; };

function renderHist(){
  const h = $('hist'); h.innerHTML = '';
  if (!sessions.length) h.append(el('p','',''), Object.assign(el('small'), {textContent:'Диалогов пока нет', style:'color:var(--mute)'}));
  sessions.forEach(s => {
    const b = el('button','h-item'); b.type='button';
    if (cur && s.id === cur.id) b.setAttribute('aria-current','true');
    const t = el('b','',s.title);
    if (s.leadState === 'sent') t.append(el('span','tag','заявка'));
    const d = new Date(s.ts);
    b.append(t, el('small','', d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) + ' · ' + s.messages.length + ' сообщ.' + (s.leadState==='sent' ? '' : ' · без заявки')));
    b.onclick = () => { cur = s; renderAll(true); };
    h.append(b);
  });
}

function renderLog(scroll){
  const log = $('log'); log.innerHTML = '';
  if (!cur || !cur.messages.length){
    const e = el('div','empty');
    e.append(el('h2','','Чем помочь вашему объекту?'), el('p','','Расскажите о задаче — подскажу, какое решение Energytool подходит, и что нужно для оценки.'));
    const d = el('div','demos');
    DEMOS.forEach(x => { const b = el('button','demo',x.t); b.type='button'; b.append(el('small','',x.s)); b.onclick = () => send(x.q); d.append(b); });
    e.append(d); log.append(e); return;
  }
  cur.messages.forEach(m => {
    if (m.role === 'user') log.append(el('div','msg user',m.content));
    else if (m.role === 'error') log.append(el('div','msg bot err',m.content));
    else {
      log.append(el('div','msg bot',m.content));
      if (debugOn()){
        const d = el('div','dbg');
        d.append(el('div','t','Время ответа: ' + (m.ms/1000).toFixed(2) + ' с' + (m.mock ? ' · демо-заглушка (бэкенд не подключён)' : '')));
        if (!m.sources.length) d.append(el('div','src','Источников нет: нужного абзаца в базе не найдено.'));
        m.sources.forEach(s => {
          const w = el('div','src');
          const c = el('code','',s.path);
          w.append(c, document.createTextNode(' · ' + (s.title||'') + (s.score!=null ? ' · оценка ' + Number(s.score).toFixed(2) : '')));
          if (s.quote) w.append(el('blockquote','',s.quote));
          d.append(w);
        });
        log.append(d);
      }
    }
  });
  if (busy){ const t = el('div','msg bot dots'); t.innerHTML='<span></span><span></span><span></span>'; log.append(t); }
  if (cur.leadState === 'draft') log.append(leadCard());
  if (cur.leadState === 'sent'){ const c = el('div','lead done'); c.append(el('h3','','Заявка передана специалисту'), el('p','n','Менеджер пресейла свяжется с вами. Это демо: заявка в CRM не отправляется.')); log.append(c); }
  if (scroll) log.scrollTop = log.scrollHeight;
}

function leadCard(){
  const L = cur.lead, c = el('form','lead');
  c.append(el('h3','','Оставить заявку специалисту'), el('p','n','Заполните только то, чем готовы поделиться. Резюме можно поправить.'));
  const f = (name, label, tag='input') => { const l = el('label','',label); const i = el(tag); i.name = name; i.value = L[name] || ''; if (tag==='textarea') i.rows = 4; l.append(i); c.append(l); return i; };
  f('fio','ФИО'); const ph = f('phone','Телефон'); ph.type='tel'; f('company','Компания'); f('summary','Резюме для менеджера','textarea');
  const row = el('div','row');
  const ok = el('button','btn','Отправить заявку'); ok.type='submit';
  const no = el('button','btn sec','Не сейчас'); no.type='button';
  no.onclick = () => { cur.leadState = 'none'; cur.lead = null; save(); renderLog(true); };
  row.append(ok, no); c.append(row);
  c.onsubmit = async e => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(c));
    ok.disabled = true;
    try { await fetch(API + '/api/lead', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); } catch(_){}
    cur.lead = body; cur.leadState = 'sent'; save(); renderAll(true);
  };
  return c;
}

function renderAll(scroll){ renderHist(); renderLog(scroll); }

if (sessions.length) cur = sessions[0]; else newSession();
renderAll();
</script>
</body>
</html>
